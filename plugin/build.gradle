plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'net.miwashi'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    website = 'https://github.com/wacoco-org/test-suites-plugin'
    vcsUrl = 'https://github.com/wacoco-org/test-suites-plugin.git'
    plugins {
        testSuites {
            id = 'net.miwashi.test-suites'
            implementationClass = 'net.miwashi.TestSuitesPlugin'
            displayName = 'Test Suites'
            description = 'Organizes tests into separate suites: unit, black-box (no access to main code), ' +
                    'white-box (full access to main code) and tagged aggregator suites (JUnit 5 @Tag across all suites). ' +
                    'Provides shared common test fixtures, suite-specific dependencies, per-suite console logging ' +
                    'and reporting controls, configurable base URLs for black-box suites, and optional fail-safe ' +
                    'HTTP reporting of test results for requirement tracing.'
            tags.set([
                    'testing',
                    'junit5',
                    'test-suites',
                    'integration-testing',
                    'smoke-testing',
                    'black-box-testing',
                    'white-box-testing',
                    'test-reporting'
            ])
        }
    }
}