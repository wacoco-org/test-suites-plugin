plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'net.miwashi'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    website = 'https://github.com/wacoco-org/test-suites-plugin'
    vcsUrl = 'https://github.com/wacoco-org/test-suites-plugin.git'
    plugins {
        testSuites {
            id = 'net.miwashi.test-suites'
            implementationClass = 'net.miwashi.TestSuitesPlugin'
            displayName = 'Test Suites'
            description = 'Adds unit, smoke, integration and regression test suites with a shared common test source set.'
            tags.set(['testing', 'junit', 'test-suites'])
        }
    }
}
